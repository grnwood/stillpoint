name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install --no-binary charset_normalizer -r sp/requirements.txt

      - name: PyInstaller build
        run: |
          pyinstaller -y packaging/sp.spec
          pyinstaller -y packaging/stillpoint-capture.spec

      - name: Smoke test bundle
        run: |
          if (!(Test-Path "dist/stillpoint/stillpoint.exe")) { throw "dist/stillpoint/stillpoint.exe not found" }
          if (!(Test-Path "dist/stillpoint-capture/stillpoint-capture.exe")) { throw "dist/stillpoint-capture/stillpoint-capture.exe not found" }

      - name: Runtime smoke test (stillpoint startup)
        run: |
          $exe = "dist/stillpoint/stillpoint.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) {
              throw "stillpoint.exe exited early with non-zero code $($proc.ExitCode)"
            }
            Write-Host "stillpoint.exe exited cleanly during smoke window."
          } else {
            Stop-Process -Id $proc.Id -Force
            Write-Host "stillpoint.exe started successfully and was terminated after smoke timeout."
          }

      - name: Runtime smoke test (stillpoint-capture startup)
        run: |
          $exe = "dist/stillpoint-capture/stillpoint-capture.exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            # Exit code 1 is expected on CI: "no local vault configured" is a clean exit, not a crash.
            if ($proc.ExitCode -notin 0,1) {
              throw "stillpoint-capture.exe exited early with unexpected code $($proc.ExitCode)"
            }
            Write-Host "stillpoint-capture.exe exited cleanly during smoke window (code $($proc.ExitCode))."
          } else {
            Stop-Process -Id $proc.Id -Force
            Write-Host "stillpoint-capture.exe started successfully and was terminated after smoke timeout."
          }

      - name: Generate Inno version include
        run: |
          python packaging/win32/generate-version.py

      - name: Install Inno Setup (portable via Chocolatey)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Remove-Item -Recurse -Force packaging\win32\Output -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path packaging\win32\Output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/Opackaging\win32\Output" "packaging\win32\stillpoint.iss"

      - name: Verify installer exists
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if (!(Test-Path "packaging/win32/Output/StillPointSetup-win-x64.exe")) { throw "Installer exe not found at packaging/win32/Output/StillPointSetup-win-x64.exe" }

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: StillPointSetup
          path: packaging/win32/Output/StillPointSetup-win-x64.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/win32/Output/StillPointSetup-win-x64.exe
          fail_on_unmatched_files: true
