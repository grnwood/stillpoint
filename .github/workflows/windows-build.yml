name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r sp/requirements.txt

      - name: PyInstaller build
        run: |
          pyinstaller -y packaging/sp.spec
          pyinstaller -y packaging/stillpoint-capture.spec

      - name: Smoke test bundle
        run: |
          if (!(Test-Path "dist/stillpoint/stillpoint.exe")) { throw "dist/stillpoint/stillpoint.exe not found" }
          if (!(Test-Path "dist/stillpoint-capture/stillpoint-capture.exe")) { throw "dist/stillpoint-capture/stillpoint-capture.exe not found" }

      - name: Generate Inno version include
        run: |
          python packaging/win32/generate-version.py

      - name: Install Inno Setup (portable via Chocolatey)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\win32\stillpoint.iss"

      - name: Zip bundle
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Remove-Item -Recurse -Force bundle -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path bundle | Out-Null
          Copy-Item -Recurse -Force dist\stillpoint bundle\
          Copy-Item -Recurse -Force dist\stillpoint-capture bundle\
          Compress-Archive -Path bundle\* -DestinationPath StillPoint-win-x64.zip

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: StillPointSetup
          path: packaging/win32/Output/StillPointSetup-win-x64.exe

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StillPoint-win-x64.zip
            packaging/win32/Output/StillPointSetup-win-x64.exe
