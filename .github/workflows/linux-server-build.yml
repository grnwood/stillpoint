name: Build Linux Server Bundle (zip)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y upx
          pip install -r sp/requirements-server.txt

      - name: PyInstaller server build
        run: |
          pyinstaller -y --clean packaging/sp-server.spec

      - name: Smoke test bundle
        run: |
          test -x dist/stillpoint-server/stillpoint-server
          test -f dist/stillpoint-server/run-server.sh
          test -f dist/stillpoint-server/_launch.sh

      - name: Zip server bundle
        run: |
          cd dist
          zip -r ../StillPoint-server-linux-x86_64.zip stillpoint-server

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: StillPoint-server-linux-x86_64
          path: StillPoint-server-linux-x86_64.zip

      - name: Upload server bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StillPoint-server-linux-x86_64.zip
